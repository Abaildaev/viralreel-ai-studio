      The families users can burn into a rendered Reel are much heavier and are
      needed only once the renderer runs — utils/renderFonts.ts fetches those on
      demand instead of blocking first paint.
    -->

      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
