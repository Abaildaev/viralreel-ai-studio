<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ViralReel AI Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      /*
        Design tokens. Everything visual should come from here rather than from
        one-off utility values, so the interface stays consistent as pages are
        added: one accent (teal), one radius scale, one type scale, one set of
        soft neutral shadows.
      */
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif'],
              mono: ['ui-monospace', 'SFMono-Regular', 'SF Mono', 'Menlo', 'monospace'],
            },
            /* Compact scale — this app is dense by design. */
            fontSize: {
              '2xs': ['0.6875rem', { lineHeight: '1rem' }],
              xs: ['0.75rem', { lineHeight: '1.125rem' }],
              sm: ['0.8125rem', { lineHeight: '1.25rem' }],
              base: ['0.875rem', { lineHeight: '1.375rem' }],
              lg: ['1rem', { lineHeight: '1.5rem' }],
              xl: ['1.125rem', { lineHeight: '1.625rem' }],
              '2xl': ['1.375rem', { lineHeight: '1.875rem' }],
              '3xl': ['1.75rem', { lineHeight: '2.125rem' }],
            },
            borderRadius: {
              md: '0.5rem',
              lg: '0.625rem',
              xl: '0.75rem',
              '2xl': '1rem',
              '3xl': '1.25rem',
            },
            colors: {
              /* Slightly cool neutrals read cleaner next to teal than pure gray. */
              gray: {
                50: '#F8FAFC',
                100: '#F1F5F9',
                200: '#E7ECF1',
                300: '#D2DAE3',
                400: '#98A4B3',
                500: '#697586',
                600: '#4B5565',
                700: '#364152',
                800: '#232B38',
                900: '#141A23',
              },
              canvas: '#FAFAFA',
            },
            /* Neutral, low-contrast elevation. No coloured glows. */
            boxShadow: {
              xs: '0 1px 2px 0 rgb(16 24 40 / 0.04)',
              sm: '0 1px 3px 0 rgb(16 24 40 / 0.05), 0 1px 2px -1px rgb(16 24 40 / 0.04)',
              DEFAULT: '0 2px 4px -1px rgb(16 24 40 / 0.05), 0 1px 2px -1px rgb(16 24 40 / 0.03)',
              md: '0 4px 8px -2px rgb(16 24 40 / 0.06), 0 2px 4px -2px rgb(16 24 40 / 0.04)',
              lg: '0 12px 16px -4px rgb(16 24 40 / 0.07), 0 4px 6px -2px rgb(16 24 40 / 0.03)',
              xl: '0 20px 24px -4px rgb(16 24 40 / 0.08), 0 8px 8px -4px rgb(16 24 40 / 0.03)',
              '2xl': '0 24px 48px -12px rgb(16 24 40 / 0.18)',
            },
          },
        },
      };
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Inter drives the interface. The remaining families are picked by users for
      the text burned into rendered Reels (see FontFamily in types.ts), so they
      must stay loaded even though the UI itself never uses them.
    -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Merriweather:ital,wght@0,300;0,400;0,700;0,900;1,300;1,400;1,700;1,900&family=M+PLUS+1p:wght@100;300;400;500;700&family=Noto+Serif:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      @font-face {
        font-family: 'GenShinGothic';
        src: local('M PLUS 1p Light'), local('MPLUS1p-Light');
        font-weight: 300;
      }
      @font-face {
        font-family: 'GenShinGothic';
        src: local('M PLUS 1p'), local('MPLUS1p-Regular');
        font-weight: 400;
      }
      @font-face {
        font-family: 'OpenSerif';
        src: local('Noto Serif'), local('NotoSerif-Regular');
        font-weight: 400;
      }
      @font-face {
        font-family: 'OpenSerif';
        src: local('Noto Serif Italic'), local('NotoSerif-Italic');
        font-weight: 400;
        font-style: italic;
      }
      @font-face {
        font-family: 'Georgia';
        src: local('Georgia');
        font-style: normal;
      }
      @font-face {
        font-family: 'Georgia';
        src: local('Georgia Italic'), local('Georgia-Italic');
        font-style: italic;
      }
    </style>
    <style>
      :root {
        --accent: #0D9488;
        --accent-strong: #0F766E;
        --canvas: #FAFAFA;
        --border: #E7ECF1;
      }

      body {
        font-family: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
        background-color: var(--canvas);
        color: #141A23;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Tabular figures keep counters and timestamps from jittering. */
      time, .tabular { font-variant-numeric: tabular-nums; }

      ::selection { background: rgba(13, 148, 136, 0.18); }

      /* One focus treatment everywhere, keyboard-only. */
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        border-radius: 4px;
      }

      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Scrollbars, restrained. */
      * { scrollbar-width: thin; scrollbar-color: #D2DAE3 transparent; }
      *::-webkit-scrollbar { width: 10px; height: 10px; }
      *::-webkit-scrollbar-thumb {
        background-color: #D2DAE3;
        border: 3px solid transparent;
        border-radius: 999px;
        background-clip: content-box;
      }
      *::-webkit-scrollbar-thumb:hover { background-color: #98A4B3; }

      /* ---- Component layer -------------------------------------------------
         Shared classes so a card is a card on every page. Prefer these over
         re-typing long utility strings.
      */

      .card {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        box-shadow: 0 1px 2px 0 rgb(16 24 40 / 0.04);
      }
      .card-interactive {
        transition: box-shadow 150ms ease, border-color 150ms ease, transform 150ms ease;
      }
      .card-interactive:hover {
        border-color: #D2DAE3;
        box-shadow: 0 4px 8px -2px rgb(16 24 40 / 0.06), 0 2px 4px -2px rgb(16 24 40 / 0.04);
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 0.75rem;
        padding: 0.5rem 0.875rem;
        font-size: 0.8125rem;
        font-weight: 500;
        line-height: 1.25rem;
        white-space: nowrap;
        transition: background-color 150ms ease, border-color 150ms ease, color 150ms ease;
      }
      .btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .btn-lg { padding: 0.6875rem 1.125rem; font-size: 0.875rem; }
      .btn-sm { padding: 0.375rem 0.625rem; font-size: 0.75rem; }

      .btn-primary { background: var(--accent); color: #fff; }
      .btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
      .btn-primary:disabled { background: #D2DAE3; color: #fff; opacity: 1; }

      .btn-secondary {
        background: #fff;
        color: #364152;
        border: 1px solid var(--border);
        box-shadow: 0 1px 2px 0 rgb(16 24 40 / 0.04);
      }
      .btn-secondary:hover:not(:disabled) { background: #F8FAFC; border-color: #D2DAE3; }

      .btn-ghost { background: transparent; color: #4B5565; }
      .btn-ghost:hover:not(:disabled) { background: #F1F5F9; color: #141A23; }

      .btn-danger { background: transparent; color: #DC2626; }
      .btn-danger:hover:not(:disabled) { background: #FEF2F2; }

      .label {
        display: block;
        font-size: 0.8125rem;
        font-weight: 500;
        color: #364152;
        margin-bottom: 0.375rem;
      }

      .field {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 0.75rem;
        background: #fff;
        color: #141A23;
        padding: 0.5625rem 0.75rem;
        font-size: 0.8125rem;
        line-height: 1.25rem;
        outline: none;
        transition: border-color 150ms ease, box-shadow 150ms ease;
      }
      .field::placeholder { color: #98A4B3; }
      .field:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.12);
      }
      .field:disabled { background: #F8FAFC; color: #697586; }

      .badge {
        display: inline-flex;
        align-items: center;
        gap: 0.25rem;
        border-radius: 999px;
        padding: 0.125rem 0.5rem;
        font-size: 0.6875rem;
        font-weight: 500;
        line-height: 1rem;
        white-space: nowrap;
      }
      .badge-neutral { background: #F1F5F9; color: #4B5565; }
      .badge-accent  { background: #F0FDFA; color: #0F766E; }
      .badge-success { background: #F0FDF4; color: #15803D; }
      .badge-warning { background: #FFFBEB; color: #B45309; }
      .badge-danger  { background: #FEF2F2; color: #B91C1C; }

      /* Range inputs are used heavily in the editor panels. */
      input[type=range] { -webkit-appearance: none; background: transparent; }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #E7ECF1;
        border-radius: 999px;
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 14px;
        width: 14px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid var(--accent);
        box-shadow: 0 1px 2px 0 rgb(16 24 40 / 0.12);
        cursor: pointer;
        margin-top: -5px;
      }
      input[type=range]:focus-visible::-webkit-slider-thumb {
        box-shadow: 0 0 0 3px rgba(13, 148, 136, 0.18);
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
