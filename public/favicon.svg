<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Brand mark. The gradient is brand-600 -> brand-400 from tailwind.config.js;
    it used to be teal, left over from the palette the app stopped using, so the
    browser tab advertised a colour that appeared nowhere in the interface.
    components/ui/Logo.tsx draws the same shape.
  -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E60FF"/>
      <stop offset="100%" style="stop-color:#5D8DFF"/>
    </linearGradient>
    <linearGradient id="play" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#EFF4FF"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bg)"/>
  <!-- Film reel circle -->
  <circle cx="256" cy="256" r="155" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="24"/>
  <!-- Play triangle -->
  <polygon points="220,168 350,256 220,344" fill="url(#play)" opacity="0.95"/>
  <!-- Sparkle dots -->
  <circle cx="390" cy="130" r="18" fill="rgba(255,255,255,0.6)"/>
  <circle cx="415" cy="105" r="10" fill="rgba(255,255,255,0.4)"/>
  <circle cx="130" cy="390" r="14" fill="rgba(255,255,255,0.35)"/>
</svg>
