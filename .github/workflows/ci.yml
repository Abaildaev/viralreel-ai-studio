name: CI

on:
  # Все ветки, а не только main: workflow, срабатывающий лишь при слиянии,
  # ловит поломку через две недели после того, как её внесли — ровно это и
  # произошло с «supabaseUrl is required», лежавшей в main незамеченной.
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
